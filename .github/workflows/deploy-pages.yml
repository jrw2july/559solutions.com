name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - agent/website-rebuild
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build and upload site
        uses: withastro/action@v6
        env:
          GITHUB_PAGES: "true"
        with:
          node-version: 24
          package-manager: pnpm@11.9.0

      - name: Verify GitHub Pages build
        run: pnpm validate:pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
